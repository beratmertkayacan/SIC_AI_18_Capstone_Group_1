<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kâfi AI</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { width: 360px; background: var(--bg); }
      #root { padding: 12px 0 10px; }
      header.top { position: relative; padding: 0 16px 10px; }
      header.top .brand-head { gap: 10px; }
      header.top .brand-text { display: flex; flex-direction: column; line-height: 1.3; }
      header.top .brand-name { font-size: 17px; }
      header.top .brand-tagline { font-size: 11px; }
      header.top .privacy-chip { position: absolute; top: 0; right: 12px; font-size: 11px; padding: 2px 8px 2px 7px; background: var(--soft); border-color: transparent; }
      hr { margin: 0; border: 0; border-top: 1px solid var(--line); }

      .card { margin: 14px 12px 0; padding: 14px 16px 16px; }
      .card.lifted { box-shadow: var(--shadow); }
      .sec-title { margin: 0; font-size: 15px; font-weight: 600; }
      .sec-sub { margin: 3px 0 10px; color: var(--muted); font-size: 12px; }
      .line { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; }
      .muted { color: var(--muted); }
      button.wide { display: block; width: 100%; margin-top: 12px; padding: 9px 14px; font-weight: 600; }
      button:not(.primary).wide { background: var(--card); }

      /* İlerleme: genelde biten mesaj sayısına kadar koyu, aşan kısım toprak tonu. */
      .progress { position: relative; padding-bottom: 18px; margin: 2px 0 6px; }
      .progress-track { position: relative; height: 8px; border-radius: 4px; background: var(--c-track); }
      .progress-usual { position: absolute; inset: 0 auto 0 0; border-radius: 4px 0 0 4px; background: var(--c-1); }
      .progress-over { position: absolute; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--c-2); }
      .progress-tick { position: absolute; top: -4px; width: 1.5px; height: 16px; background: var(--fg); transform: translateX(-50%); }
      .progress-labels { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; }
      .progress-label { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
      .progress-label.now { color: var(--fg); font-weight: 600; }

      .week { padding: 14px 16px 14px; }
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .sec-meta { color: var(--muted); font-size: 11.5px; }

      /* "Bu hafta" pencerede sıkı: 360x600'e sığsın diye gruplar arası boşluk ve satır aralığı daha dar. */
      .week .hab-group { margin-top: 9px; padding-top: 8px; }
      .week .hab-line, .week .hab-tip-text { line-height: 1.42; }
      .week button.wide { margin-top: 10px; padding: 8px 14px; }
      .week .hab-label { color: var(--fg); font-size: 12.5px; }
      .week .hab-rows { margin-top: 3px; }
      .week .hab-rows li { padding: 1px 0; }
      .week .hab-line + .hab-line { margin-top: 3px; }
      .week .hab-tip-actions { margin-top: 2px; }
      .restart { display: flex; flex-direction: column; align-items: flex-start; margin: -4px 0 12px -8px; }
      .restart-hint { padding-left: 8px; color: var(--muted); font-size: 11.5px; }

      .nav-row {
        display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; border: 0; border-radius: 0;
        text-align: left; background: transparent;
      }
      .nav-row:hover { background: color-mix(in srgb, var(--soft) 70%, transparent); border: 0; }
      .nav-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .nav-title { font-weight: 600; font-size: 13.5px; }
      .nav-sub { color: var(--muted); font-size: 11.5px; }
      .chev { flex: none; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); }
      .help { margin: 8px 16px 0; font-size: 12.5px; }

      /* Ayarlar alt sayfası */
      .sub-top { padding: 2px 10px 12px; }
      button.back { display: inline-flex; align-items: center; gap: 10px; padding: 4px 8px; border: 0; font-size: 17px; font-weight: 600; }
      button.back::before { content: ""; width: 7px; height: 7px; border-left: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(45deg); }
      button.back:hover { border: 0; }
      .settings { padding: 4px 16px; }
      .setting { display: flex; align-items: flex-start; gap: 16px; padding: 12px 0; cursor: pointer; }
      .setting + .setting { border-top: 1px solid var(--line); }
      .setting:has(input:disabled) { cursor: default; }
      .setting-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .setting-label { font-weight: 600; font-size: 13px; }
      .setting-hint { color: var(--muted); font-size: 11.5px; line-height: 1.45; }
      .setting:has(input:disabled) .setting-text { opacity: .55; }
      .data { padding: 14px 16px 4px; }
      .data .line { margin-bottom: 12px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .actions button { flex: 1; white-space: nowrap; padding: 8px 10px; font-size: 12.5px; font-weight: 600; background: var(--card); }
      .confirm { padding: 12px 14px; border: 1px solid var(--danger); border-radius: 12px; background: var(--card); }
      .confirm-text { margin: 0 0 10px; font-weight: 500; font-size: 13px; }
      button.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--card); }
      button.danger-solid:hover { filter: brightness(1.08); background: var(--danger); border-color: var(--danger); }
      .notice { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="popup.js"></script>
  </body>
</html>
