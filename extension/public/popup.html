<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KafiAI</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1d2420;
        --muted: #5d6a63;
        --line: #dfe5e1;
        --accent: #1f6f54;
        --danger: #a23a2e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c211e;
          --fg: #e8efe9;
          --muted: #9aa8a0;
          --line: #333b36;
          --accent: #55b592;
          --danger: #e08a7c;
        }
      }
      body {
        margin: 0;
        width: 320px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #root { padding: 16px; }
      h1 { margin: 0 0 12px; font-size: 18px; }
      h2 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
      section { padding: 12px 0; border-top: 1px solid var(--line); }
      h1 + section { border-top: 0; padding-top: 0; }
      .toggle { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
      .toggle input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
      .toggle input:disabled + .toggle-text { opacity: 0.5; }
      .toggle-text { display: flex; flex-direction: column; }
      .toggle-hint, .muted { color: var(--muted); font-size: 12px; }
      .counts { list-style: none; margin: 0; padding: 0; }
      .counts li { display: flex; justify-content: space-between; padding: 2px 0; }
      p { margin: 0 0 8px; }
      .actions { display: flex; gap: 8px; }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.danger { color: var(--danger); border-color: var(--danger); }
      .privacy { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
