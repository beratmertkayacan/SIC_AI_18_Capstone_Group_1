<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kâfi</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { width: 360px; }
      #root { padding: 14px 12px 16px; }
      header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 14px; }
      header.top .brand-name { font-size: 18px; }
      header.top .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
      header.top .privacy-chip { font-size: 10.5px; padding: 2px 8px 2px 7px; }
      h2 { margin: 0 0 8px; font-size: 12.5px; color: var(--accent-ink); font-weight: 600; letter-spacing: .01em; }
      section { padding: 12px 14px 13px; margin: 0 0 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
      section.conversation { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
      p { margin: 0 0 6px; }
      .muted { color: var(--muted); font-size: 12px; }

      /* Ayarlar: onay kutusu anahtar görünümünde (yine gerçek bir checkbox; klavye ve ekran okuyucu aynı çalışır). */
      .toggle { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
      .toggle + .toggle { border-top: 1px solid var(--line); }
      .toggle-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .toggle-label { font-weight: 500; }
      .toggle-hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
      .toggle input {
        order: 2; flex: none; appearance: none; -webkit-appearance: none; margin: 1px 0 0; width: 32px; height: 19px;
        border-radius: 999px; cursor: pointer; border: 1px solid var(--line);
        background: radial-gradient(circle at center, var(--surface) 0 6.5px, transparent 7px) 1px 50% / 17px 17px no-repeat, var(--soft);
        transition: background-color .18s ease-out, background-position .18s cubic-bezier(.2, .8, .2, 1), border-color .18s ease-out;
      }
      .toggle input:checked {
        background: radial-gradient(circle at center, var(--primary-fg) 0 6.5px, transparent 7px) 13px 50% / 17px 17px no-repeat, var(--primary);
        border-color: var(--primary);
      }
      .toggle input:disabled { opacity: .45; cursor: default; }
      .toggle input:disabled + .toggle-text { opacity: .5; }
      .toggle:has(input:disabled) { cursor: default; }

      /* Son 7 gün: görev satırları kutu içinde kutu değil, ince çizgiyle ayrılan bir liste. */
      .rows { margin: 8px -6px 0; }
      details.row { border-top: 1px solid var(--line); border-radius: 0; }
      details.row summary {
        list-style: none; display: flex; align-items: baseline; gap: 8px;
        padding: 9px 6px; cursor: pointer; border-radius: 8px;
      }
      details.row summary::-webkit-details-marker { display: none; }
      details.row summary::after {
        content: ""; flex: none; align-self: center; margin-left: auto; width: 6px; height: 6px;
        border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
        transform: translateY(-2px) rotate(45deg); transition: transform .18s ease-out;
      }
      details.row[open] summary::after { transform: translateY(1px) rotate(-135deg); }
      details.row summary:hover { background: color-mix(in srgb, var(--soft) 70%, transparent); }
      details.row summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      details.row.plain { margin: 8px -6px 0; }
      .row-title { font-weight: 600; }
      .row-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
      .row-body { padding: 0 6px 10px; }
      .row-body p { margin: 0 0 6px; font-size: 13px; }
      .tip { color: var(--accent-ink); font-weight: 500; }
      .counts { list-style: none; margin: 0; padding: 0; font-size: 13px; }
      .counts li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
      .counts strong { font-weight: 600; }

      .conversation p { margin: 0 0 4px; }
      .conversation button.primary { margin-top: 8px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .actions button { white-space: nowrap; padding: 7px 12px; font-size: 12.5px; }
      .help { margin: 10px 4px 4px; font-size: 12.5px; font-weight: 500; }
      .privacy { margin: 0 4px; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
      @media (prefers-reduced-motion: reduce) {
        details.row summary::after, .toggle input { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
