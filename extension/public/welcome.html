<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kâfi AI'ya hoş geldin</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { font-size: 15px; line-height: 1.6; }
      #root { max-width: 960px; margin: 0 auto; padding: clamp(48px, 9vh, 96px) 32px 88px; }
      .hero { display: flex; align-items: center; gap: 24px; }
      .hero .mark-logo { border-radius: 18px; box-shadow: var(--shadow); }
      h1 { margin: 0; font-size: clamp(30px, 3.6vw, 40px); line-height: 1.12; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
      .tagline { margin: 6px 0 0; color: var(--accent-ink); font-size: 15px; font-weight: 500; }
      .lead { margin: 48px 0 0; max-width: 52rem; font-size: 17px; line-height: 1.7; text-wrap: pretty; }

      .block { margin-top: 64px; }
      .block-title { margin: 0 0 10px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
      .block-intro { margin: 0 0 28px; max-width: 52rem; color: var(--muted); }
      .block-outro { margin: 26px 0 0; font-weight: 600; font-size: 14.5px; }

      .features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
      .feature { padding: 22px 16px 24px; }
      .feature-kicker { margin: 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
      .feature-name { margin: 2px 8px 18px; color: var(--accent-ink); font-size: 13px; }
      .feature-body { margin: 22px 8px 0; font-size: 13.5px; line-height: 1.6; }

      /* Küçük çizimler: gerçek arayüzün sade kopyası */
      .art { display: grid; align-content: center; gap: 10px; min-height: 150px; padding: 16px; border-radius: 12px; background: var(--soft); box-sizing: border-box; }
      .mini-composer { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
      .mini-text { flex: 1; font-size: 12px; }
      .mini-ring { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--c-1); box-sizing: border-box; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-2) 30%, transparent); }
      .mini-send { position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); }
      .mini-send::after { content: ""; position: absolute; left: 9px; top: 9.5px; width: 6px; height: 6px; border-top: 1.6px solid var(--primary-fg); border-right: 1.6px solid var(--primary-fg); transform: rotate(45deg); }
      .mini-hint { position: relative; justify-self: stretch; padding: 8px 12px; border-radius: 8px; background: var(--tip-bg); color: var(--tip-fg); font-size: 11.5px; text-align: center; }
      .mini-hint::before { content: ""; position: absolute; top: -5px; right: 62px; width: 10px; height: 10px; background: var(--tip-bg); transform: rotate(45deg); border-radius: 2px; }
      .mini-card { padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
      .mini-title { margin: 0 0 8px; font-size: 12px; font-weight: 600; line-height: 1.4; display: flex; gap: 8px; }
      .mini-title::before { content: ""; flex: none; width: 11px; height: 11px; margin-top: 2px; border-radius: 50%; border: 1.8px solid var(--c-1); box-sizing: border-box; }
      .mini-body { margin: -2px 0 8px 19px; font-size: 11px; line-height: 1.45; color: var(--muted); }
      .mini-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; white-space: nowrap; }
      .chip.dark { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }

      .privacy-rows { margin: 20px 0 0; border-bottom: 1px solid var(--line); }
      .privacy-row { display: grid; grid-template-columns: 14rem 1fr; column-gap: 32px; padding: 22px 0; border-top: 1px solid var(--line); }
      .privacy-row dt { font-weight: 600; font-size: 15px; }
      .privacy-row dd { margin: 0; }
      .privacy-row dd p { margin: 0 0 10px; max-width: 46rem; text-wrap: pretty; }
      .privacy-row dd p:last-child { margin-bottom: 0; }

      .teaser { display: flex; align-items: center; gap: 20px; margin-top: 44px; padding: 22px 28px; border-radius: 16px; background: var(--soft); }
      .teaser-icon { flex: none; display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 48px; height: 48px; padding-bottom: 14px; border-radius: 12px; background: var(--card); box-sizing: border-box; }
      .teaser-icon i { display: block; width: 5px; border-radius: 2px; background: var(--c-1); }
      .teaser-icon i:nth-child(1) { height: 10px; } .teaser-icon i:nth-child(2) { height: 18px; } .teaser-icon i:nth-child(3) { height: 14px; background: var(--c-2); }
      .teaser-text { flex: 1; min-width: 0; }
      .teaser-title { margin: 0; font-weight: 600; font-size: 15px; }
      .teaser-body { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .teaser-preview { flex: none; display: flex; gap: 2px; width: 160px; height: 10px; }
      .teaser-preview i { display: block; height: 100%; border-radius: 2px; }
      .teaser-preview i:nth-child(1) { flex: 3; background: var(--c-1); } .teaser-preview i:nth-child(2) { flex: 2; background: var(--c-2); }
      .teaser-preview i:nth-child(3) { flex: 1; background: var(--c-3); } .teaser-preview i:nth-child(4) { flex: 4; background: var(--c-track); }

      .steps { list-style: none; counter-reset: step; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
      .steps li { counter-increment: step; }
      .steps li::before {
        content: counter(step); display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 16px; border-radius: 50%;
        background: var(--primary); color: var(--primary-fg); font-weight: 600; font-size: 15px;
      }
      .step-title { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
      .step-body { margin: 0; color: var(--muted); font-size: 13.5px; }

      button.primary { margin-top: 56px; padding: 12px 34px; font-size: 15px; font-weight: 600; }

      @media (max-width: 900px) {
        .features, .steps { grid-template-columns: 1fr; }
        .features { max-width: 420px; }
      }
      @media (max-width: 620px) {
        #root { padding: 40px 20px 64px; }
        .hero { gap: 16px; }
        .hero .mark-logo { width: 56px; height: 56px; border-radius: 14px; }
        .lead { margin-top: 32px; font-size: 16px; }
        .block { margin-top: 48px; }
        .privacy-row { grid-template-columns: 1fr; row-gap: 6px; padding: 18px 0; }
        .teaser { flex-wrap: wrap; padding: 20px; }
        .teaser-preview { display: none; }
        button.primary { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="welcome.js"></script>
  </body>
</html>
