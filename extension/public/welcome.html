<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kâfi'ye hoş geldin</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { font-size: 16px; line-height: 1.6; }
      #root { max-width: 600px; margin: 0 auto; padding: 56px 24px 72px; }
      .hero { display: flex; align-items: center; gap: 18px; margin: 0 0 14px; }
      .hero .mark { color: var(--accent); flex: none; }
      h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
      .tagline { margin: 2px 0 0; color: var(--muted); font-size: 16px; font-weight: 500; }
      .lead { margin: 18px 0 22px; font-size: 17px; }
      section { padding: 16px 18px; margin: 0 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
      h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
      p { margin: 0 0 6px; }
      button.primary { margin-top: 18px; padding: 10px 26px; font-size: 15px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="welcome.js"></script>
  </body>
</html>
